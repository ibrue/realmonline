name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build (debug)
        run: swift build

      - name: Build app bundle (release)
        run: |
          chmod +x scripts/bundle-app.sh
          ./scripts/bundle-app.sh 0.0.0-ci

      - name: Verify bundle
        run: |
          test -x dist/RealmOnline.app/Contents/MacOS/RealmOnline
          plutil -lint dist/RealmOnline.app/Contents/Info.plist
