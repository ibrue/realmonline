[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realmonline"
version = "1.0.0"
description = "Minecraft Realms online player count in your macOS menu bar"
requires-python = ">=3.11"
dependencies = [
    "rumps>=0.4.0",
    "requests>=2.31.0",
    "keyring>=25.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
realmonline = "realmonline.app:main"

[tool.setuptools.packages.find]
include = ["realmonline*"]
